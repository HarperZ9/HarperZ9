[readme]
# Visible words, counted after link targets and HTML tags are stripped. Text
# inside collapsed <details> sections and the generated tables counts too.
#
# Raised from 1000 to 1700 on 2026-10-01 by operator decision. The old limit
# was set for a short hiring page. The profile now carries the current scope
# (Flywheel and the flagships, the investigations, the monitor direction,
# consulting with its independence rules) and keeps depth in collapsed
# sections, so the first screen stays short while the page stays complete.
# The redesigned README counted about 1300 words at the change; 1700 leaves
# room for the daily refresh of the release and writing tables and for one
# more published series piece without another limit change.
max_words = 1700

