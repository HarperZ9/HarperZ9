name: Refresh profile

# Rewrites the release table, the latest-writing list and the version badges
# from the site feed and the GitHub releases API. Uses only GITHUB_TOKEN.

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Refresh live blocks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/refresh_profile.py
      - name: Check profile surface
        run: python scripts/check_profile_surface.py
      - name: Commit when something changed
        run: |
          if git diff --quiet; then
            echo "profile is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/art
          git commit -m "chore: refresh releases and latest writing"
          git push
